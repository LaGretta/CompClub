services:

  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: pcclub-gateway
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      AuthService__Url: http://auth-service:8080
      MainService__Url: http://main-service:8080

    depends_on:
      - auth-service
      - main-service


  auth-service:
    build:
      context: ./AuthService/src/AuthService
      dockerfile: Dockerfile
    container_name: pcclub-auth
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # приклад
      ConnectionStrings__DefaultConnection: ${AUTH_DB_CONNECTION_STRING}

    ports:
      - "8081:8080"


  main-service:
    build:
      context: ./MainService
      dockerfile: Dockerfile
    container_name: pcclub-main
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # приклад
      ConnectionStrings__DefaultConnection: ${MAIN_DB_CONNECTION_STRING}

    ports:
      - "8082:8080"